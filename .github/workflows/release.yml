name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install git-annex on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-annex
      - name: Install git-annex on macOS
        if: runner.os == 'macOS'
        run: brew install git-annex
      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build release archives
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            ./scripts/package-release.sh "$RELEASE_TAG" "${target%/*}" "${target#*/}"
          done
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
